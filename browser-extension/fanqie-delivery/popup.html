<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DropMind 番茄投递</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>DropMind 番茄投递</h1><p>连接本机工作台后，在番茄后台使用右下角投递面板。</p><label>本机地址<input id="baseUrl" value="http://127.0.0.1:3000"></label><label>连接令牌<input id="token" type="password" autocomplete="off" placeholder="从 DropMind 发布准备页复制"></label><div class="actions"><button id="save" type="button">保存并测试</button><button id="show" type="button" class="secondary">显示令牌</button></div><div id="message" hidden></div></main><script src="popup.js"></script></body>
</html>
